<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin — Kevin Vouch</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body class="admin-body">

  <div id="login" class="login-card">
    <h2>Admin Login</h2>
    <input id="pw" type="password" placeholder="password" />
    <button id="loginBtn">Enter</button>
    <p id="loginErr" class="err"></p>
  </div>

  <div id="panel" class="panel hidden">
    <header class="panel-head">
      <h1>Vouch Admin</h1>
      <button id="logout" class="ghost">logout</button>
    </header>

    <section class="card">
      <h3>Mass Create</h3>
      <p class="muted">generates fake vouches & saves them in this browser</p>
      <div class="row">
        <input id="count" type="number" min="1" max="500" value="25" />
        <button id="createBtn">Generate</button>
        <button id="clearBtn" class="danger">Clear All</button>
      </div>
      <p id="status" class="muted"></p>
    </section>

    <section class="card">
      <h3>All Vouches (<span id="count2">0</span>)</h3>
      <div id="list" class="list"></div>
    </section>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
