<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kevin Vouch System</title>

  <meta
    name="description"
    content="Kevin Vouch System — customer testimonials and community feedback."
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="navbar">
    <a href="#" class="logo">Kevin<span>Vouch</span></a>

    <nav class="nav-links">
      <a href="#vouches">Vouches</a>

      <a
        href="https://discord.gg/luascript"
        target="_blank"
        rel="noopener noreferrer"
        class="contact-link"
      >
        Contact Us
      </a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <span class="eyebrow">KEVIN VOUCH SYSTEM</span>

        <h1>
          Customer <span>Vouches</span>
        </h1>

        <p>
          Feedback and experiences shared by our community.
        </p>

        <a href="#vouches" class="primary-button">
          View Vouches
        </a>
      </div>
    </section>

    <section id="vouches" class="vouches-section">
      <div class="section-heading">
        <h2>Community <span>Vouches</span></h2>
        <p>Browse customer feedback below.</p>
      </div>

      <div id="vouches-container" class="vouches-grid">
        <p class="loading-message">Loading vouches...</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>

</html>
