<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kevin — Vouches</title>
<link rel="stylesheet" href="/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>" />
</head>
<body>
  <header class="hero">
    <div class="badge">✔ verified seller</div>
    <h1>Kevin</h1>
    <p class="sub">real vouches from real people</p>
    <div class="stats">
      <div><strong id="total">0</strong><span>vouches</span></div>
      <div><strong id="avg">5.0</strong><span>avg rating</span></div>
      <div><strong id="verified">0</strong><span>verified</span></div>
    </div>
  </header>

  <main>
    <div class="controls">
      <input id="search" placeholder="search vouches..." />
      <select id="sort">
        <option value="new">newest</option>
        <option value="old">oldest</option>
        <option value="high">highest rated</option>
      </select>
    </div>
    <div id="grid" class="grid"></div>
  </main>

  <footer>© Kevin — all rights reserved</footer>
  <script src="/main.js"></script>
</body>
</html>
